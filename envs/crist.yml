# Kernel environment of demo.ipynb (steps 1 and 3-7 run in-kernel; steps 0 and 2 call the other envs).
# Exact package list of the environment the notebook was run in: envs/exported/cell2location.yml
name: crist
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - jupyter
  - ipykernel
  - nbconvert
  - nbclient
  - pyyaml=6.0.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - numpy==2.2.0
      - pandas==2.2.3
      - scipy==1.15.2
      - scikit-learn==1.5.2
      - scanpy==1.11.1
      - anndata==0.11.4
      - h5py==3.13.0
      - pyarrow==20.0.0
      - matplotlib==3.10.1
      - seaborn==0.13.2
      - tifffile==2026.3.3
      - imagecodecs==2026.3.6
      - pillow==11.2.1
      - tqdm==4.67.1
      - cell2location==0.1.4
      - scvi-tools==1.3.0
      - pyro-ppl==1.9.1
      - jax==0.4.35
