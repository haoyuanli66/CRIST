# Environment of the vendored bin2cell package for step 0 on Visium HD without cell segmentation
# (annotation.py hd-bin2cell); name must match BIN2CELL_ENV in annotation.py.
# Exact package list of the environment used here: envs/exported/visium_hd_annotation.yml
name: visium_hd_annotation
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.15.3
      - scanpy==1.11.5
      - anndata==0.11.4
      - h5py==3.15.1
      - pyarrow==23.0.0
      - scikit-image==0.25.2
      - stardist==0.9.2
      - csbdeep==0.8.2
      - opencv-python-headless==4.13.0.92
      - tifffile==2025.5.10
      - imagecodecs==2025.3.30
      - seaborn==0.13.2
      - matplotlib==3.10.8
      - pillow==12.2.0
      - tqdm==4.67.1
